<form class="message-input" (submit)="$event.preventDefault(); submit()">
  <textarea
    rows="1"
    [value]="draft()"
    (input)="draft.set($any($event.target).value)"
    (keydown)="onKeydown($event)"
    placeholder="Écrivez votre message... (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)"
    [disabled]="disabled()"
  ></textarea>
  <button type="submit" [disabled]="disabled()">Envoyer</button>
</form>
